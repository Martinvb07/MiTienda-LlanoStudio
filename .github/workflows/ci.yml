name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Un push nuevo sobre la misma rama cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint · tipos · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Generar cliente de Prisma
        # El código tipado depende del cliente generado, así que va antes del
        # lint y del typecheck. No toca la base de datos.
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Lint
        run: npm run lint

      - name: Verificación de tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npx tsc -p tsconfig.build.json

  frontend:
    name: Frontend (lint · tipos · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificación de tipos
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_DOMINIO_BASE: llanostudio.co
          NEXT_PUBLIC_SUBDOMINIO_PANEL: mitienda
          URL_API: http://localhost:4000

  e2e:
    name: Punta a punta (comprar en una tienda de verdad)
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRETO: secreto-de-ci-para-e2e
      TOKEN_INTERNO: token-interno-de-ci
      MITIENDA_TOKEN_INTERNO: token-interno-de-ci
      DOMINIO_BASE: llanostudio.co
      SUBDOMINIO_PANEL: mitienda
      NEXT_PUBLIC_DOMINIO_BASE: llanostudio.co
      NEXT_PUBLIC_SUBDOMINIO_PANEL: mitienda
      URL_API: http://localhost:4000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: API (migraciones y arranque)
        working-directory: backend
        run: |
          npm ci
          npx prisma migrate deploy
          npx prisma generate
          # NODE_ENV=test apaga los topes de intentos: las pruebas crean cuentas seguidas.
          NODE_ENV=test nohup npx tsx src/servidor.ts > ../api.log 2>&1 &

      - name: Web (build y arranque)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx next start -p 3000 > ../web.log 2>&1 &

      - name: Esperar a que respondan
        run: |
          for i in $(seq 1 60); do
            curl -sf localhost:4000/api/salud >/dev/null && curl -s -o /dev/null localhost:3000 && exit 0
            sleep 2
          done
          echo "No arrancaron a tiempo"; cat api.log web.log; exit 1

      - name: Navegador
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Pruebas
        working-directory: frontend
        run: npm run e2e

      - name: Registros e informe si falló
        if: failure()
        run: tail -100 api.log web.log || true

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informe-e2e
          path: frontend/playwright-report
          retention-days: 7
