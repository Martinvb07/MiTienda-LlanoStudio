# nginx para Mi Tienda (plantilla de referencia: deploy/instalar.sh genera la
# configuración real con los puertos libres que encuentre).
# Convive con el sitio de Llano Studio en el mismo VPS:
# llanostudio.co y www siguen en su propio archivo (nginx-llanostudio); este
# atiende mitienda.llanostudio.co (web + panel) y *.llanostudio.co (tiendas).
#
#   sudo cp deploy/nginx-mitienda.conf /etc/nginx/sites-available/mitienda
#   sudo ln -s /etc/nginx/sites-available/mitienda /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# nginx elige primero el server_name exacto (llanostudio.co, www) y sólo
# después el comodín, así que el sitio del estudio no se ve afectado.
#
# Certificados: ver deploy/LEEME-VPS.md (paso "HTTPS para los subdominios").

upstream mitienda_web {
    server 127.0.0.1:4200;  # PUERTO_WEB de .mitienda.env
    keepalive 16;
}

upstream mitienda_api {
    server 127.0.0.1:4201;  # PUERTO_API de .mitienda.env
    keepalive 16;
}

# HTTP → HTTPS (certbot también usa este bloque para sus comprobaciones).
server {
    listen 80;
    listen [::]:80;
    server_name mitienda.llanostudio.co *.llanostudio.co;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mitienda.llanostudio.co *.llanostudio.co;

    # Certificado comodín: cubre mitienda.llanostudio.co y cualquier tienda.
    ssl_certificate     /etc/letsencrypt/live/llanostudio.co-comodin/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llanostudio.co-comodin/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Fotos subidas sin R2: directo del disco, sin pasar por Node.
    location /api/medios-locales/ {
        alias /var/www/llanostudio/sitios/mitienda/backend/.medios/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Subida de imágenes del panel (la API acepta hasta 8 MB).
    location = /api/panel/medios {
        client_max_body_size 9m;
        proxy_pass http://mitienda_api;
        include /etc/nginx/snippets/mitienda-proxy.conf;
    }

    # El panel, el admin y la API pública van directo a Express.
    location /api/ {
        client_max_body_size 2m;
        proxy_pass http://mitienda_api;
        include /etc/nginx/snippets/mitienda-proxy.conf;
    }

    # Estáticos de Next: inmutables, se pueden cachear para siempre.
    location /_next/static/ {
        proxy_pass http://mitienda_web;
        include /etc/nginx/snippets/mitienda-proxy.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Todo lo demás: web, panel y tiendas. Next decide qué pintar según el Host.
    location / {
        proxy_pass http://mitienda_web;
        include /etc/nginx/snippets/mitienda-proxy.conf;
    }
}
